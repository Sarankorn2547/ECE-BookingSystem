<!-- Top Navbar (reusable partial) -->
<nav class="home-navbar">
    <a href="{% url 'booking:dashboard' %}" class="navbar-brand">
        <img src="https://ece.engr.tu.ac.th/assets/img/logo/ECE-department-logo.svg" alt="ECE Logo">
        <span class="navbar-brand-text d-none d-sm-flex">
            <span class="navbar-brand-title">ECE Room Booking</span>
            <span class="navbar-brand-subtitle">Thammasat University</span>
        </span>
    </a>

    <!-- Hamburger button (mobile only) -->
    <button class="navbar-hamburger" id="navbarToggle" aria-label="เมนู" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Nav links -->
    <ul class="navbar-nav" id="navbarMenu">
        <li><a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}"
                href="{% url 'booking:dashboard' %}"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a></li>
        <li><a class="nav-link {% if active_page == 'booking' %}active{% endif %}"
                href="{% url 'booking:booking_form' %}"><i class="fa-solid fa-calendar-plus"></i><span>จองห้อง</span></a></li>
        <li><a class="nav-link {% if active_page == 'calendar' %}active{% endif %}"
                href="{% url 'booking:calendar' %}"><i class="fa-solid fa-calendar-days"></i><span>ปฏิทิน</span></a></li>
        <li><a class="nav-link {% if active_page == 'my_bookings' %}active{% endif %}"
                href="{% url 'booking:my_bookings' %}"><i class="fa-solid fa-list-check"></i><span>การจองของฉัน</span></a></li>
        {% if is_admin %}
        <li class="nav-divider-mobile"></li>
        <li><a class="nav-link {% if active_page == 'admin_approvals' %}active{% endif %}"
                href="{% url 'booking:approval_queue' %}"><i class="fa-solid fa-clipboard-check"></i><span>อนุมัติการจอง</span></a></li>
        <li><a class="nav-link {% if active_page == 'admin_reports' %}active{% endif %}"
                href="{% url 'booking:admin_reports' %}"><i class="fa-solid fa-chart-bar"></i><span>รายงาน</span></a></li>
        <li><a class="nav-link {% if active_page == 'admin_system' %}active{% endif %}"
                href="{% url 'booking:admin_system' %}"><i class="fa-solid fa-gear"></i><span>จัดการระบบ</span></a></li>
        {% endif %}
        <li class="nav-divider-mobile"></li>
        <li><a class="nav-link logout-link" href="{% url 'booking:logout' %}"><i class="fa-solid fa-right-from-bracket"></i><span>ออกจากระบบ</span></a></li>
    </ul>

    <!-- Mobile overlay -->
    <div class="navbar-overlay" id="navbarOverlay"></div>
</nav>

<script>
(function () {
    var btn = document.getElementById('navbarToggle');
    var menu = document.getElementById('navbarMenu');
    var overlay = document.getElementById('navbarOverlay');
    function closeMenu() {
        btn.classList.remove('open');
        menu.classList.remove('open');
        overlay.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
    }
    btn.addEventListener('click', function () {
        var isOpen = menu.classList.toggle('open');
        btn.classList.toggle('open', isOpen);
        overlay.classList.toggle('open', isOpen);
        btn.setAttribute('aria-expanded', isOpen.toString());
    });
    overlay.addEventListener('click', closeMenu);
    // Close on nav link click
    menu.querySelectorAll('.nav-link').forEach(function (link) {
        link.addEventListener('click', closeMenu);
    });
})();
</script>
