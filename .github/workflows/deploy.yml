name: CD - Auto Deploy to VPS

on:
  push:
    branches:
      - deploy # รันเฉพาะเมื่อมีการ push ขึ้น branch deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 217.216.108.16
          username: root
          port: 8822
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # ไปยังโฟลเดอร์โปรเจกต์บน VPS (ถ้ายังไม่มีจะทำการ Clone)
            PROJECT_DIR="/root/ECE-BookingSystem"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone -b deploy https://github.com/Sarankorn2547/ECE-BookingSystem.git "$PROJECT_DIR"
            fi
            
            cd "$PROJECT_DIR"
            
            # ดึงโค้ดล่าสุด
            git pull origin deploy
            
            # รันระบบใหม่ (Build และ Up คอนเทนเนอร์)
            docker compose up -d --build
            
            # รัน Migration และ Collect static โดยใช้ run --rm เพื่อให้มันรอจนกว่าเน็ตเวิร์กจะพร้อม
            docker compose run --rm web python manage.py migrate
            docker compose run --rm web python manage.py collectstatic --noinput
            
            echo "✅ Deployment Successful!"
