services:
  db:
    image: postgres:16-alpine
    container_name: ece-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file: .env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ece-network
    labels:
      - "com.ece.allow_logs=true"

  ece-web:
    build: .
    container_name: ece-web
    command: gunicorn ece_booking.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=ece_booking.settings
      - TZ=Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ece-network
    labels:
      - "com.ece.allow_logs=true"

  nginx:
    image: nginx:1.25-alpine
    container_name: ece-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - 8081:80
    depends_on:
      - ece-web
    networks:
      - ece-network
    labels:
      - "com.ece.allow_logs=true"

  ece-cron:
    build: .
    container_name: ece-cron
    entrypoint: ["/bin/bash", "/app/docker/cron_entrypoint.sh"]
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=ece_booking.settings
      - TZ=Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ece-network
    labels:
      - "com.ece.allow_logs=true"

  ece-bot:
    build:
      context: ./teams-bot
      dockerfile: Dockerfile
    container_name: ece-bot
    volumes:
      - ./teams-bot:/app
    env_file: .env
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ece-network
    labels:
      - "com.ece.allow_logs=true"

networks:
  ece-network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
