services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - 5432
    labels:
      - "com.ece.allow_logs=true"

  web:
    build: .
    command: gunicorn ece_booking.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - SQL_HOST=db
      - SQL_PORT=5432
    depends_on:
      - db
    labels:
      - "com.ece.allow_logs=true"

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - 8081:80 # เปลี่ยนจาก 80 เป็น 8081 เพื่อไม่ให้ซ้ำกับโปรเจกต์อื่น
    depends_on:
      - web
    labels:
      - "com.ece.allow_logs=true"

  # --- Dozzle Log Viewer (Port 8888) ---
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_FILTER=label=com.ece.allow_logs=true
    ports:
      - 8888:8080

volumes:
  postgres_data:
  static_volume:
  media_volume:
